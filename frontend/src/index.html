<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Fhemt ? · Sache ce que tu maîtrises</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fhemt ? (فهمت؟) : plateforme d'apprentissage adaptatif. Un quiz par concept, un niveau de maîtrise, un parcours de révision où chaque étape a sa raison. Projet web Sup'Com.">
  <meta name="theme-color" content="#1b365d">
  <!-- Icône du site : un SVG de 0,5 Ko (net à toutes les tailles) + un PNG pour l'écran d'accueil des iPhone -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Polices du mode fiche (chargées seulement si ce mode est choisi, avec display=swap) :
       la connexion aux serveurs de polices est ouverte à l'avance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Applique les préférences (habillage fiche, animations réduites) avant l'affichage, sans clignotement -->
  <script>
    try {
      if (localStorage.getItem('fhemt.ui') === 'fiche') document.documentElement.setAttribute('data-ui', 'fiche');
      if (localStorage.getItem('fhemt.motion') === 'reduce') document.documentElement.setAttribute('data-motion', 'reduce');
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
