<header class="nav">
  <a class="nav__brand" routerLink="/" aria-label="Fhemt ? : accueil">
    <span class="nav__logo">Fhemt <span class="nav__q">?</span></span>
    <span class="nav__arabic" lang="ar">فهمت؟</span>
  </a>

  <nav class="nav__links" aria-label="Navigation principale">
    @if (auth.isLoggedIn()) {
      @if (auth.isTeacher()) {
        <a
          routerLink="/teacher"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: true }"
          >Ma classe</a
        >
        <a routerLink="/teacher/questions" routerLinkActive="is-active" ariaCurrentWhenActive="page"
          >Questions</a
        >
      } @else {
        <a routerLink="/dashboard" routerLinkActive="is-active" ariaCurrentWhenActive="page"
          >Ma maîtrise</a
        >
        <a routerLink="/path" routerLinkActive="is-active" ariaCurrentWhenActive="page"
          >Mon parcours</a
        >
        <a routerLink="/concepts" routerLinkActive="is-active" ariaCurrentWhenActive="page"
          >Carte des concepts</a
        >
      }
    } @else {
      <a routerLink="/about" routerLinkActive="is-active" ariaCurrentWhenActive="page">À propos</a>
      <a routerLink="/contact" routerLinkActive="is-active" ariaCurrentWhenActive="page">Contact</a>
    }
  </nav>

  <div class="nav__user">
    <button
      type="button"
      class="ui-toggle"
      [attr.aria-pressed]="ui.fiche()"
      aria-label="Mode fiche de révision"
      title="Basculer entre la version classique et la version fiche de révision"
      (click)="ui.toggle()"
    >
      <svg class="ui-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 4.5l4.5 4.5-8.6 8.6H6.4v-4.5z" />
        <path d="M12.6 6.9l4.5 4.5" />
        <path d="M4 21h9" />
      </svg>
      <span class="ui-toggle__label">Mode fiche</span>
      <span class="ui-toggle__switch" aria-hidden="true"></span>
    </button>

    @if (auth.user(); as user) {
      <a
        class="chip chip--link"
        [class.chip--teacher]="auth.isTeacher()"
        routerLink="/profile"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        [attr.aria-label]="'Mon profil : ' + user.name + ', ' + roleLabel(user.role)"
      >
        {{ user.name }} · {{ roleLabel(user.role) }}
      </a>
      <button class="btn btn--ghost" type="button" (click)="logout()">Déconnexion</button>
    } @else {
      <a class="btn btn--primary" routerLink="/login">Se connecter</a>
    }
  </div>
</header>
