# Intégration continue : à chaque push, GitHub vérifie que le code du frontend est propre
# (ESLint, Prettier), qu'il compile et que ses tests passent, puis que les tests de l'API passent
# et qu'elle démarre et répond. Une croix rouge = quelque chose est cassé.
name: CI

on:
  push:
    branches: [main, Rayen, objectif-4]
  pull_request:

jobs:
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Qualité du code (ESLint)
        run: npm run lint
      - name: Mise en forme (Prettier)
        run: npm run format:check
      - run: npm run build
      - run: npx ng test --watch=false

  backend:
    name: Backend (Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: L'API démarre et répond
        run: |
          node src/server.js &
          sleep 3
          curl -sf http://localhost:3000/api/health
          curl -sf http://localhost:3000/api/concepts > /dev/null
